services:
  # ------------------------------------------------------------------
  # Backend API (Express + Socket.IO) -> https://stayflow-api.onrender.com
  # ------------------------------------------------------------------
  - type: web
    name: stayflow-api
    runtime: node
    plan: free
    region: oregon
    rootDir: .
    buildCommand: npm install && npm run build --workspace server
    startCommand: npm run start --workspace server
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - server/**/*
        - package.json
        - package-lock.json
        - tsconfig.base.json
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.13.0
      # Secrets — generated by Render (32+ chars, unique per variable)
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL_DAYS
        value: 30
      # Secrets — you paste these in the Render dashboard on first sync
      - key: MONGODB_URI
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      # Origins — update these if Render assigns different subdomains
      - key: CLIENT_URL
        value: https://stayflow-website.onrender.com
      - key: DASHBOARD_URL
        value: https://stayflow-dashboard.onrender.com
      - key: WEB_ORIGINS
        value: https://stayflow-website.onrender.com,https://stayflow-dashboard.onrender.com

  # ------------------------------------------------------------------
  # Public guest website -> https://stayflow-website.onrender.com
  # ------------------------------------------------------------------
  - type: web
    name: stayflow-website
    runtime: static
    buildCommand: npm install && npm run build --workspace apps/website
    staticPublishPath: apps/website/dist
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - apps/website/**/*
        - package.json
        - package-lock.json
        - tsconfig.base.json
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://stayflow-api.onrender.com/api
      - key: VITE_WEBSITE_URL
        value: https://stayflow-website.onrender.com

  # ------------------------------------------------------------------
  # Staff dashboard -> https://stayflow-dashboard.onrender.com
  # ------------------------------------------------------------------
  - type: web
    name: stayflow-dashboard
    runtime: static
    buildCommand: npm install && npm run build --workspace apps/dashboard
    staticPublishPath: apps/dashboard/dist
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - apps/dashboard/**/*
        - package.json
        - package-lock.json
        - tsconfig.base.json
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://stayflow-api.onrender.com/api
      - key: VITE_WEBSITE_URL
        value: https://stayflow-website.onrender.com
